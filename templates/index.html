<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1-Step Binomial Tree Option Pricing</title>
    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- Added padding classes to ensure visibility -->
    <div class="container mt-5 p-4">
        <h1 class="text-center">1-Step Binomial Tree Option Pricing</h1>
        <p class="text-center text-muted">Calculate the option price for a European call or put option.</p>

        <form action="/calculate" method="post" class="mx-auto" style="max-width: 500px;">
            <div class="form-group">
                <label for="S0">Initial Stock Price (S0):</label>
                <input type="number" step="0.01" name="S0" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="K">Strike Price (K):</label>
                <input type="number" step="0.01" name="K" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="T">Time to Maturity (T, in years):</label>
                <input type="number" step="0.01" name="T" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="dt">Time Increment (Δt, in years):</label>
                <input type="number" step="0.01" name="dt" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="r">Risk-free Interest Rate (r):</label>
                <input type="number" step="0.01" name="r" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="sigma">Volatility (σ):</label>
                <input type="number" step="0.01" name="sigma" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="option_type">Option Type:</label>
                <select name="option_type" class="form-control">
                    <option value="call">Call</option>
                    <option value="put">Put</option>
                </select>
            </div>

            <!-- Ensure button is visible and has padding around it -->
            <button type="submit" class="btn btn-primary btn-block mt-4">Calculate Option Price</button>
        </form>
    </div>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
